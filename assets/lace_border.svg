<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 36" preserveAspectRatio="none">
  <defs>
    <pattern id="lacePattern" width="60" height="36" patternUnits="userSpaceOnUse">
      <!-- Victorian scallop arches in antique warm gold / taupe -->
      <path d="M 0 0 Q 15 16 30 0 Q 45 16 60 0" fill="none" stroke="rgba(180, 138, 98, 0.45)" stroke-width="1.2"/>
      <path d="M 0 6 Q 15 22 30 6 Q 45 22 60 6" fill="none" stroke="rgba(180, 138, 98, 0.3)" stroke-width="0.8"/>
      <!-- Floral eyelet dots -->
      <circle cx="15" cy="14" r="2.2" fill="none" stroke="rgba(180, 138, 98, 0.4)" stroke-width="0.9"/>
      <circle cx="45" cy="14" r="2.2" fill="none" stroke="rgba(180, 138, 98, 0.4)" stroke-width="0.9"/>
      <circle cx="30" cy="8" r="1.5" fill="rgba(180, 138, 98, 0.35)"/>
      <circle cx="30" cy="22" r="2.8" fill="none" stroke="rgba(180, 138, 98, 0.45)" stroke-width="1"/>
      <circle cx="30" cy="22" r="1.2" fill="rgba(180, 138, 98, 0.5)"/>
      <!-- Scallop bottom picots -->
      <path d="M 22 28 Q 30 35 38 28" fill="none" stroke="rgba(180, 138, 98, 0.45)" stroke-width="1"/>
      <circle cx="30" cy="33" r="1.4" fill="rgba(180, 138, 98, 0.5)"/>
      <line x1="0" y1="1" x2="60" y2="1" stroke="rgba(180, 138, 98, 0.35)" stroke-width="0.8" stroke-dasharray="2,2"/>
    </pattern>
  </defs>
  <rect width="600" height="36" fill="url(#lacePattern)" />
</svg>
