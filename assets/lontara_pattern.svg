<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <defs>
    <style>
      .lontara-text {
        font-family: 'Noto Sans Buginese', 'Segoe UI Historic', 'Leelawadee UI', serif;
        font-size: 22px;
        fill: #4e2f18;
        font-weight: 700;
        letter-spacing: 4px;
      }
    </style>
  </defs>
  <g transform="rotate(-12, 250, 250)" opacity="0.20">
    <text x="-70" y="35" class="lontara-text">ᨔᨗᨄᨀᨈᨕᨘ ᨞ ᨔᨗᨄᨀᨒᨙᨅᨗ ᨞ ᨔᨗᨄᨀᨕᨗᨂᨙ ᨞ ᨊᨘᨑᨘ ᨑᨖᨆᨊᨗᨕᨑ ᨞ ᨆᨘᨖ ᨑᨙᨔᨀᨗ</text>
    <text x="-110" y="90" class="lontara-text">ᨅᨍᨗ ᨅᨍᨗ ᨕᨆᨀᨗ ᨞ ᨔᨒᨆ ᨔᨒᨆ ᨕᨆᨗᨋ ᨞ ᨔᨗᨑᨗ ᨊ ᨄᨌᨙ</text>
    <text x="-50" y="145" class="lontara-text">ᨓᨒᨗᨆᨈᨘ ᨕᨘᨑᨘᨔᨘ ᨞ ᨊᨗᨕ ᨞ ᨑᨙᨔᨀᨗ ᨞ ᨕᨀᨉ ᨊᨗᨀ ᨞ ᨑᨙᨔᨙᨄᨔᨗ</text>
    <text x="-95" y="200" class="lontara-text">ᨔᨗᨄᨀᨈᨕᨘ ᨞ ᨔᨗᨄᨀᨒᨙᨅᨗ ᨞ ᨔᨗᨄᨀᨕᨗᨂᨙ ᨞ ᨈᨀᨒ ᨞ ᨔᨘᨒᨓᨙᨔᨗ</text>
    <text x="-65" y="255" class="lontara-text">ᨊᨘᨑᨘ ᨑᨖᨆᨊᨗᨕᨑ ᨞ ᨆᨘᨖ ᨑᨙᨔᨀᨗ ᨞ ᨔᨗᨑᨗ ᨊ ᨄᨌᨙ</text>
    <text x="-120" y="310" class="lontara-text">ᨅᨍᨗ ᨅᨍᨗ ᨕᨆᨀᨗ ᨞ ᨔᨒᨆ ᨔᨒᨆ ᨞ ᨓᨒᨗᨆᨈᨘ ᨕᨘᨑᨘᨔᨘ</text>
    <text x="-40" y="365" class="lontara-text">ᨔᨗᨄᨀᨈᨕᨘ ᨞ ᨔᨗᨄᨀᨒᨙᨅᨗ ᨞ ᨔᨗᨄᨀᨕᨗᨂᨙ ᨞ ᨕᨀᨉ ᨊᨗᨀ</text>
    <text x="-85" y="420" class="lontara-text">ᨊᨗᨕ ᨞ ᨑᨙᨔᨀᨗ ᨞ ᨑᨙᨔᨙᨄᨔᨗ ᨞ ᨈᨀᨒ ᨞ ᨔᨘᨒᨓᨙᨔᨗ</text>
    <text x="-55" y="475" class="lontara-text">ᨔᨗᨄᨀᨈᨕᨘ ᨞ ᨔᨗᨄᨀᨒᨙᨅᨗ ᨞ ᨔᨗᨄᨀᨕᨗᨂᨙ ᨞ ᨔᨗᨑᨗ ᨊ ᨄᨌᨙ</text>
    <text x="-100" y="530" class="lontara-text">ᨊᨘᨑᨘ ᨑᨖᨆᨊᨗᨕᨑ ᨞ ᨆᨘᨖ ᨑᨙᨔᨀᨗ ᨞ ᨓᨒᨗᨆᨈᨘ ᨕᨘᨑᨘᨔᨘ</text>
  </g>
</svg>
